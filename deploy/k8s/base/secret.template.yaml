# TEMPLATE - not applied by any kustomization, on purpose.
#
# `deploy/k8s/base/kustomization.yaml` deliberately does not list this file, so
# `kubectl apply -k` can never create it and no real value can ever ride into
# git behind one. Fill it in and apply it by hand, or - better - skip the file
# and use the imperative form below, which never writes the value to disk at
# all.
#
# The local kind workflow does this for you: `deploy/local/oasis-kind.sh
# secrets` generates a SESSION_SECRET and the dev database password into a
# gitignored file and creates the Secret from it, printing neither.
#
#   kubectl create secret generic web-secrets \
#     --namespace oasis-race-control \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/oasis?sslmode=require' \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)"
#
# To rotate, replace it and restart the pods so they pick it up - envFrom is
# read once, at container start:
#
#   kubectl create secret generic web-secrets ... --dry-run=client -o yaml \
#     | kubectl apply -f -
#   kubectl -n oasis-race-control rollout restart deployment/web
#
# In production these two values live in Vercel's environment variables and
# Neon, not in Kubernetes at all (docs/deploy.md). This Secret is what a
# cluster-hosted deployment would need.
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: oasis-race-control
  labels:
    app.kubernetes.io/name: oasis-race-control
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: oasis-race-control
type: Opaque
stringData:
  # Postgres connection string. Use the POOLED endpoint for Neon (the -pooler
  # host, with sslmode=require) - src/lib/db.ts opens a pool per instance.
  DATABASE_URL: "REPLACE_ME"
  # Signs driver and staff session cookies (HS256). Any long random string:
  #   openssl rand -base64 48
  # Replacing it signs every open session out.
  SESSION_SECRET: "REPLACE_ME"

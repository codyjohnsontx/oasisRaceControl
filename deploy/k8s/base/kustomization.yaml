apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What the venue's web tier would look like in any cluster: the Next.js app,
# nothing else.
#
# Deliberately absent:
#   - Postgres. Production is Neon, a managed service. Putting a database in
#     here would describe an architecture this project does not have. The local
#     overlay adds a development-only one.
#   - The rig agent. It is .NET win-x64, reads iRacing shared memory, and is
#     installed on each simulator rather than deployed. It cannot run in a
#     Linux container and should not.
#   - secret.template.yaml. Listing it would let `kubectl apply -k` create a
#     Secret, which is how a real value eventually ends up in a commit.
#
# Rendered with the kustomize built into kubectl:
#   kubectl kustomize deploy/k8s/base
namespace: oasis-race-control

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# One place to retag. `oasis-race-control/web` is a local name: nothing pushes
# it to a registry yet, and the local overlay loads it straight into kind.
images:
  - name: oasis-race-control/web
    newTag: dev

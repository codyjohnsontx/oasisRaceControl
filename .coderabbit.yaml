# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration
#
# Goal: keep the full review quality Cody values, while cutting the number of
# review runs and the amount of noise each one has to chew through.
#
# Schema confirmed against docs.coderabbit.ai. Defaults noted so it is obvious
# what is actually being changed and what is just written down for clarity.

reviews:
  # Already the default. Stated explicitly so nobody "tunes" it to assertive
  # later and wonders where the noise came from.
  profile: chill

  auto_review:
    enabled: true

    # THE ONE THAT MATTERS.
    # Default is true: CodeRabbit re-reviews as new commits land. Our workflow
    # pushes fix rounds after the first review, so that spends a second review
    # on a pull request we are still working on.
    #
    # What this setting does: CodeRabbit reviews once, when the pull request
    # opens, and does NOT re-review automatically as further commits land.
    #
    # What it therefore REQUIRES: `@coderabbitai review` must be requested
    # before merging any pull request that gained commits after it opened.
    # This is an obligation, not a habit - nothing in this repository enforces
    # it, so it is on whoever merges.
    #
    # What happens if that is skipped: those later commits merge unreviewed.
    # They are usually the fix rounds, which is exactly the code that ends up
    # on main.
    auto_incremental_review: false

    # Already the default. Draft pull requests are not reviewed, which is what
    # makes "open early as a draft" safe if we ever want it.
    drafts: false

  # Source and documentation are deliberately NOT filtered: today's most useful
  # comments were on markdown, and that is worth paying for.
  #
  # Read this before deleting a line. CodeRabbit applies a built-in default
  # ignore list on top of whatever is written here - lock files, binaries,
  # generated code, media. 137 patterns, counted from the tables under the
  # `### Default ignored paths` heading in docs.coderabbit.ai/llms-full.txt,
  # which is where the full list is published; re-count it there rather than
  # trusting this number. An entry with `!` adds to that list; an entry
  # WITHOUT `!` force-includes a path the defaults would otherwise skip.
  # Mixing the two does not narrow review to only the included paths. So a `!`
  # line that merely restates a default changes nothing, and every entry below
  # is labelled with which of those it is.
  path_filters:
    # LOAD-BEARING - force-include. The npm lockfile is in CodeRabbit's
    # defaults, so without this line it is never reviewed. We want it reviewed:
    # a lockfile is where a transitive dependency first appears, where an
    # integrity hash changes, and where a registry URL gets rewritten, and
    # nothing else in a diff shows those. It has changed 4 times in this
    # repository's history, so this buys supply-chain review at close to no
    # recurring cost - a rare high-value review, not a per-pull-request tax.
    - "apps/web/package-lock.json"

    # FORCE-INCLUDE - no-op today, deliberate anyway. Unlike the npm lockfile
    # above, these filenames are NOT in CodeRabbit's defaults, despite looking
    # like they should be: the default list carries `!**/package-lock.json`
    # (an exact name, not these) and `!**/*.lock` (an extension these do not
    # have). So the five NuGet lockfiles under spike/ are already reviewed and
    # these two lines change nothing right now. They are written as includes
    # rather than dropped because the intent belongs in this file, and because
    # stating it keeps the outcome the same if CodeRabbit ever adds these names
    # to its defaults.
    #
    # That intent is the npm lockfile's supply-chain argument, only stronger.
    # .github/workflows/spike-safety.yml restores the spike solution with
    # `dotnet restore --locked-mode`, then publishes a self-contained unsigned
    # win-x64 VM candidate using -p:RestoreLockedMode=true and
    # -p:NuGetLockFilePath=packages.win-x64.lock.json, hard-failing if
    # IRSDKSharper.dll or YamlDotNet.dll reach the published output. These
    # hashes are the live enforcement boundary for a build that goes to the
    # venue canary on real hardware, not prototype scaffolding. And the
    # recurring cost is lower than the npm case, not higher: each of the five
    # lockfiles has changed exactly once in this repository's history, against
    # four times for apps/web/package-lock.json.
    - "**/packages.lock.json"
    - "**/packages.win-x64.lock.json"

    # REDUNDANT with CodeRabbit's defaults, kept only so this file states its
    # whole intent rather than leaning on a list that lives elsewhere and can
    # change. Removing it changes nothing today.
    - "!**/*.png"

    # Not listed, on purpose: *.svg. It is default-ignored, and the usual reason
    # to override that is inline SVG in a web app, where an SVG is executable
    # markup that can carry <script>, on* handlers, or javascript: hrefs. This
    # repository inlines none: it tracks zero .svg files, and apps/web has no
    # inline <svg>, no dangerouslySetInnerHTML, and no svgr loader. If SVG is
    # ever inlined here, force-include it the way the lockfile is above.

  # Already the default, restated because this is the summary Cody actually
  # reads and nobody should switch it off without knowing that.
  high_level_summary: true

  # Already the default, restated because the status line is how we tell a
  # finished review from a running one.
  review_status: true

  # Already the default - CodeRabbit does not add the poem unless you ask for
  # it. Stated explicitly so every part of a review's output is accounted for
  # in this file rather than inferred from what is missing.
  poem: false

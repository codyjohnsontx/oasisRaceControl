# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration
#
# Goal: keep the full review quality Cody values, while cutting the number of
# review runs and the amount of noise each one has to chew through.
#
# Schema confirmed against docs.coderabbit.ai. Defaults noted so it is obvious
# what is actually being changed and what is just written down for clarity.

reviews:
  # LOAD-BEARING - this key must stay here, and must stay `assertive`.
  # It is NOT a restatement of a default and it does NOT inherit the
  # organization setting. Omitting it applies CodeRabbit's own `chill` default,
  # which silently makes every review in this repository shallower than the
  # rest of the fleet. Verified: DiazMartialArts pull requests #15, #16 and #17
  # carry no repository config and CodeRabbit reports `profile: ASSERTIVE`,
  # matching the organization setting; repositories that do carry a config file
  # report `CHILL`.
  #
  # Review depth is the thing being paid for here. Cut the NUMBER of review
  # runs (see auto_incremental_review below) - never the depth of one.
  profile: assertive

  auto_review:
    enabled: true

    # THE ONE THAT MATTERS.
    # Default is true: CodeRabbit re-reviews as new commits land. Our workflow
    # pushes fix rounds after the first review, so that spends a second review
    # on a pull request we are still working on.
    #
    # What this setting does: CodeRabbit reviews once, when the pull request
    # opens, and does NOT re-review automatically as further commits land.
    #
    # What was observed, on a sibling repository running this same config:
    # commits that landed after the on-open review were followed by explicit
    # `@coderabbitai review` and `@coderabbitai full review` requests, and each
    # was answered by an ordinary issue comment - no submitted review, no new
    # line-level comments.
    #
    # What could not be established: whether those requests left the later
    # commits unreviewed, or reviewed them and found nothing to say. A review
    # that finds nothing may leave no submitted-review artifact, and nothing
    # gathered rules that out; the trial also reported the account's included
    # review limit reached under CodeRabbit's Fair Usage Limits Policy.
    #
    # So do not treat a request, or its reply, as proof that the later commits
    # were reviewed. AGENTS.md's "## Pull request review" section carries the
    # fuller account, with timestamps and counts.
    auto_incremental_review: false

    # Already the default. Draft pull requests are not reviewed, which is what
    # makes "open early as a draft" safe if we ever want it.
    drafts: false

  # Source and documentation are deliberately NOT filtered: today's most useful
  # comments were on markdown, and that is worth paying for.
  #
  # Read this before adding a line. CodeRabbit applies a built-in default
  # ignore list on top of whatever is written here - lock files, binaries,
  # generated code, media. 137 patterns, counted from the tables under the
  # "Default ignored paths" heading of
  # docs.coderabbit.ai/configuration/path-instructions, which is where the full
  # list is published (the same section also appears in
  # docs.coderabbit.ai/llms-full.txt if you would rather count it in plain
  # text); re-count it there rather than trusting this number.
  #
  # EVERY ENTRY BELOW MUST BEGIN WITH `!`. An entry with `!` adds to the
  # default ignore list. An entry WITHOUT `!` is an INCLUDE, and a single
  # include narrows the WHOLE review to only what it matches - everything else
  # is skipped as "excluded by none and included by none". An earlier version
  # of this file claimed mixing the two does not narrow the review. That is
  # wrong, and it silently switched review off for nearly all of one repository
  # for most of a day. Three include entries lived here (apps/web
  # package-lock.json, **/packages.lock.json, **/packages.win-x64.lock.json)
  # and have been removed.
  #
  # Cost of removing them, stated so nobody rediscovers it as a surprise:
  # apps/web/package-lock.json matches CodeRabbit's default `!**/package-lock.json`
  # and so is not reviewed. Losing lockfile review is the price of having the
  # rest of the repository reviewed at all; there is no force-include that buys
  # one without costing the other. The two NuGet patterns were already no-ops -
  # those filenames are not in the defaults (which carry the exact name
  # `package-lock.json` and the extension `*.lock`, neither of which matches),
  # so the five lockfiles under spike/ are still reviewed with these lines gone.
  #
  # If you think a force-include is needed, raise it - do not add one here.
  path_filters:
    # REDUNDANT with CodeRabbit's defaults, kept only so this file states its
    # whole intent rather than leaning on a list that lives elsewhere and can
    # change. Removing it changes nothing today.
    - "!**/*.png"

    # Not listed, on purpose: *.svg. It is default-ignored, and the usual reason
    # to override that is inline SVG in a web app, where an SVG is executable
    # markup that can carry <script>, on* handlers, or javascript: hrefs. This
    # repository inlines none: it tracks zero .svg files, and apps/web has no
    # inline <svg>, no dangerouslySetInnerHTML, and no svgr loader. If SVG is
    # ever inlined here, do not add an include line for it: see the `!`-only
    # rule above and raise the question instead.

  # Already the default, restated because this is the summary Cody actually
  # reads and nobody should switch it off without knowing that.
  high_level_summary: true

  # Already the default, restated because the status line is how we tell a
  # finished review from a running one.
  review_status: true

  # Already the default - CodeRabbit does not add the poem unless you ask for
  # it. Stated explicitly so every part of a review's output is accounted for
  # in this file rather than inferred from what is missing.
  poem: false
